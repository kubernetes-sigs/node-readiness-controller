apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: nrrcontroller
    app.kubernetes.io/managed-by: kustomize
  name: configmap-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
