# permissions to manage the readiness-taints configmap within the controller namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: nrrcontroller
    app.kubernetes.io/managed-by: kustomize
  name: configmap-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
