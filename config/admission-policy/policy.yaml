---
# MutatingAdmissionPolicy for automatic DaemonSet readiness toleration injection.
# Reads active taint keys from the readiness-taints ConfigMap.
# Requires: Kubernetes >= 1.30 (v1beta1) or >= 1.36 (v1).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-daemonset-readiness-tolerations
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets"]
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  variables:
    # Check if opt-out annotation is set on the DaemonSet or Pod template
    - name: optedOut
      expression: |
        (has(object.metadata.annotations) &&
         object.metadata.annotations.exists(k, k == "readiness.k8s.io/auto-tolerate" && object.metadata.annotations[k] == "false")) ||
        (has(object.spec.template.metadata.annotations) &&
         object.spec.template.metadata.annotations.exists(k, k == "readiness.k8s.io/auto-tolerate" && object.spec.template.metadata.annotations[k] == "false"))
    # Retrieve existing tolerations from pod template
    - name: existingTolerations
      expression: |
        has(object.spec.template.spec.tolerations) ?
          object.spec.template.spec.tolerations : []
    # Parse comma-separated taint keys and filter empty tokens to prevent wildcard tolerations
    - name: taintKeys
      expression: |
        has(params.data) && ("taint-keys" in params.data) && params.data["taint-keys"] != "" ?
          params.data["taint-keys"].split(",").filter(key, key != "") : []
    # Build tolerations for keys not already present on the DaemonSet
    - name: tolerationsToInject
      expression: |
        variables.taintKeys
          .filter(key, !variables.existingTolerations.exists(t, (has(t.key) && t.key == key) || ((!has(t.key) || t.key == "") && has(t.operator) && t.operator == "Exists" && (!has(t.effect) || t.effect == "NoSchedule"))))
          .map(key, {
            "key": key,
            "operator": "Exists",
            "effect": "NoSchedule"
          })
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          !variables.optedOut && size(variables.tolerationsToInject) > 0 ?
          [
            JSONPatch{
              op: has(object.spec.template.spec.tolerations) ? "replace" : "add",
              path: "/spec/template/spec/tolerations",
              value: variables.existingTolerations + variables.tolerationsToInject
            }
          ] : []
  reinvocationPolicy: Never
