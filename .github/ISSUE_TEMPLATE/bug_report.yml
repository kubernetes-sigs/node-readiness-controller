name: Bug Report
description: Report an issue with the node-readiness-controller's behavior.
title: "[BUG] <Short description of the issue>"
labels: ["kind/bug", "triage/needs-information"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! 
        Before submitting, please ensure you have searched the [existing issues](https://github.com/kubernetes-sigs/node-readiness-controller/issues) to avoid duplicates.

        **Generative AI Usage Disclosure**

        If you used AI tools in preparing this issue, please review our [Generative AI Usage Disclosure](https://github.com/kubernetes-sigs/node-readiness-controller/blob/main/CONTRIBUTING.md#generative-ai-usage-disclosure) guidelines and disclose it below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug. What did the controller do (or fail to do)?
      placeholder: The controller did abc to the node even though xyz...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior? Please include all relevant info.
      placeholder: |
        1. Deploy the controller using...
        2. Apply the following Node configuration...
        3. Observe the readiness condition by running...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The controller was supposed to xyz...
    validations:
      required: true

  - type: input
    id: controller-version
    attributes:
      label: Controller Version / Image Tag
      description: Which version or container image tag of the node-readiness-controller are you running?
      placeholder: vX.Y.Z or main (commit abc1234)
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes Version
      description: Provide the output of `kubectl version`.
      placeholder: Client Version vX.Y.Z
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Controller Logs
      description: |
        Please provide the relevant logs from the controller pod. 
        `kubectl logs deployment/node-readiness-controller -n <namespace>`
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Additional Environment Details
      description: Any other relevant details.
    validations:
      required: false

  - type: checkboxes
    id: ai-disclosure
    attributes:
      label: AI Tools Usage
      options:
        - label: No AI tools were used
        - label: AI tools were used (complete below)

  - type: textarea
    id: ai-tools-usage
    attributes:
      label: How They Were Used
      description: Describe what the AI helped with (e.g., drafting the description, analyzing logs) and which parts of the issue were affected.
    validations:
      required: false
