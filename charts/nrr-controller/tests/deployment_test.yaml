suite: Test Node Readiness Controller Deployment

templates:
  - "*.yaml"

release:
  name: nrr-controller

set:
  replicaCount: 1

tests:
  - it: creates Deployment
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: enables leader-election by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: disables metrics by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=0

  - it: adds metrics secure args when enabled
    set:
      metrics:
        enabled: true
        secure: true
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:8443

  - it: exposes webhook port when webhook enabled
    set:
      webhook:
        enabled: true
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: webhook-server
