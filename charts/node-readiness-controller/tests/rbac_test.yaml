suite: Test Node Readiness Controller Manager RBAC

templates:
  - "*.yaml"

release:
  name: node-readiness-controller

tests:
  - it: grants events on both the core and events.k8s.io groups
    template: templates/rbac.yaml
    documentSelector:
      path: metadata.name
      value: node-readiness-controller-manager-role
    asserts:
      - isKind:
          of: ClusterRole
      # The controller records taint events via k8s.io/client-go/tools/events,
      # which writes to events.k8s.io/v1. Granting only the core group makes
      # every TaintAdded, TaintRemoved and TaintAdopted write forbidden.
      - contains:
          path: rules
          content:
            apiGroups: ["", "events.k8s.io"]
            resources: ["events"]
            verbs: ["create", "patch"]

  - it: grants the node and rule permissions the controller needs
    template: templates/rbac.yaml
    documentSelector:
      path: metadata.name
      value: node-readiness-controller-manager-role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list", "patch", "update", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes/status"]
            verbs: ["get"]
      - contains:
          path: rules
          content:
            apiGroups: ["readiness.node.x-k8s.io"]
            resources: ["nodereadinessrules"]
            verbs: ["get", "list", "patch", "update", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["readiness.node.x-k8s.io"]
            resources: ["nodereadinessrules/finalizers"]
            verbs: ["update"]
      - contains:
          path: rules
          content:
            apiGroups: ["readiness.node.x-k8s.io"]
            resources: ["nodereadinessrules/status"]
            verbs: ["get", "patch", "update"]

  - it: omits rbac resources when rbac.create is disabled
    template: templates/rbac.yaml
    set:
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates leader election role and rolebinding in the release namespace by default
    template: templates/rbac.yaml
    release:
      namespace: test-ns
    asserts:
      - isKind:
          of: Role
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-role
      - equal:
          path: metadata.namespace
          value: test-ns
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-role
      - isKind:
          of: RoleBinding
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-rolebinding
      - equal:
          path: metadata.namespace
          value: test-ns
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-rolebinding
      - equal:
          path: subjects[0].namespace
          value: test-ns
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-rolebinding

  - it: overrides leader election role and rolebinding namespace when leaderElection.namespace is set
    template: templates/rbac.yaml
    release:
      namespace: test-ns
    set:
      leaderElection:
        namespace: kube-system
    asserts:
      - equal:
          path: metadata.namespace
          value: kube-system
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-role
      - equal:
          path: metadata.namespace
          value: kube-system
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-rolebinding
      - equal:
          path: subjects[0].namespace
          value: test-ns
        documentSelector:
          path: metadata.name
          value: node-readiness-controller-leader-election-rolebinding

  - it: omits leader election role and rolebinding when leaderElection.enabled is false
    template: templates/rbac.yaml
    set:
      leaderElection:
        enabled: false
    asserts:
      - hasDocuments:
          count: 8
