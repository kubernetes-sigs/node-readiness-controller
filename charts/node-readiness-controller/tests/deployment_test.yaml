suite: Test Node Readiness Controller Deployment

templates:
  - "*.yaml"

release:
  name: node-readiness-controller

set:
  replicaCount: 1

tests:
  - it: creates Deployment
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: enables leader-election by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: disables metrics by default
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=0

  - it: adds metrics secure args when enabled
    set:
      metrics:
        enabled: true
        secure: true
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-secure
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-bind-address=:8443

  - it: exposes webhook port when webhook enabled
    set:
      webhook:
        enabled: true
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: webhook-server

  - it: does not pass concurrency args at defaults
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --node-concurrent-reconciles=1
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rule-concurrent-reconciles=1

  - it: passes node-concurrent-reconciles when raised
    set:
      controller:
        nodeConcurrentReconciles: 10
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --node-concurrent-reconciles=10

  - it: passes rule-concurrent-reconciles when raised
    set:
      controller:
        ruleConcurrentReconciles: 5
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --rule-concurrent-reconciles=5

  - it: does not pass kube-api-qps at default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --kube-api-qps=-1

  - it: passes kube-api-qps when overridden
    set:
      controller:
        kubeAPIQPS: 50
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kube-api-qps=50

  - it: passes kube-api-burst when overridden
    set:
      controller:
        kubeAPIBurst: 100
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kube-api-burst=100

  - it: does not pass enable-node-state-metrics by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --enable-node-state-metrics

  - it: passes enable-node-state-metrics when enabled
    set:
      controller:
        enableNodeStateMetrics: true
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-node-state-metrics

  - it: does not pass pprof-bind-address by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --pprof-bind-address=

  - it: passes pprof-bind-address when set
    set:
      controller:
        pprofBindAddress: ":6060"
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--pprof-bind-address=:6060"

  - it: does not pass leader-election-namespace by default
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-namespace=

  - it: passes leader-election-namespace when set
    set:
      leaderElection:
        namespace: kube-system
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-namespace=kube-system

  - it: renders topologySpreadConstraints when set
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: node-readiness-controller
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone

  - it: derives container and probe ports from the default healthProbeBindAddress
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8081

  - it: derives container and probe ports from a custom healthProbeBindAddress
    set:
      healthProbeBindAddress: ":9090"
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --health-probe-bind-address=:9090
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9090
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9090
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9090

  - it: derives probe ports when the bind address includes a host
    set:
      healthProbeBindAddress: "0.0.0.0:9091"
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9091
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9091
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9091

  - it: derives probe ports from an IPv6 bind address
    set:
      healthProbeBindAddress: "[::]:9092"
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9092
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 9092
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 9092

  - it: omits ports and probes when the health probe endpoint is disabled
    set:
      healthProbeBindAddress: "0"
    template: templates/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].ports
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: keeps the webhook port when the health probe endpoint is disabled
    set:
      healthProbeBindAddress: "0"
      webhook:
        enabled: true
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: webhook-server
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: fails when healthProbeBindAddress has no port
    set:
      healthProbeBindAddress: "localhost"
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'healthProbeBindAddress "localhost" must end with ":<port>"'
