{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "node-readiness-controller.fullname" . }}
  namespace: {{ include "node-readiness-controller.namespace" . }}
  labels:
    {{- include "node-readiness-controller.labels" . | nindent 4 }}
spec:
  {{- if or .Values.podDisruptionBudget.minAvailable (eq (toString .Values.podDisruptionBudget.minAvailable) "0") }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if or .Values.podDisruptionBudget.maxUnavailable (eq (toString .Values.podDisruptionBudget.maxUnavailable) "0") }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "node-readiness-controller.selectorLabels" . | nindent 6 }}
{{- end }}
