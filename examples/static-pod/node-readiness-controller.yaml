apiVersion: v1
kind: Pod
metadata:
  name: node-readiness-controller
  namespace: kube-system
  labels:
    component: node-readiness-controller
    tier: control-plane
  spec:
  # Init container to prepare a readable kubeconfig for the non-root manager.
  # prepare-kubeconfig must run as root: /etc/kubernetes/admin.conf is
  # typically mode 600 root:root on kubeadm clusters, so a non-root UID
  # cannot read it to copy it into the shared emptyDir.
  initContainers:
  - name: prepare-kubeconfig
    image: busybox:1.36-uclibc
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 32Mi
    command:
    - sh
    - -c
    - |
      cp /etc/kubernetes/admin.conf /tmp/kubeconfig/admin.conf
      chmod 644 /tmp/kubeconfig/admin.conf
    volumeMounts:
    - name: host-kubeconfig
      mountPath: /etc/kubernetes/admin.conf
      readOnly: true
    - name: nrc-kubeconfig
      mountPath: /tmp/kubeconfig
  containers:
  - name: manager
    image: controller:v0.4.1
    imagePullPolicy: IfNotPresent
    command:
    - /manager
    args:
    - --kubeconfig=/etc/kubernetes/nrc/admin.conf
    - --leader-elect=true
    - --leader-election-namespace=kube-system
    - --metrics-bind-address=:8082
    - --health-probe-bind-address=:8081
    - --zap-log-level=info
    securityContext:
      runAsUser: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    volumeMounts:
    - name: nrc-kubeconfig
      mountPath: /etc/kubernetes/nrc
      readOnly: true
  volumes:
  - name: host-kubeconfig
    hostPath:
      path: /etc/kubernetes/admin.conf
      type: File
  - name: nrc-kubeconfig
    emptyDir: {}
  hostNetwork: true
  priorityClassName: system-node-critical
